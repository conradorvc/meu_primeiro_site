{% extends "base.html" %}

{% block content %}
    <i><p>Olá, meu nome é: {{ nome }}!</p></i>
    <p>Eu moro em: {{ cidade }}.</p>
    <h3>Meus cursos são:</h3>
    <ul>
        {% for curso in cursos %}
            <i><li>{{ curso }}</li></i>
        {% endfor %}
    </ul>

    <h3>Meus hobbies são:</h3>
    <ul>
        {% for hobby in hobbies %}
            <i><li>{{ hobby }}</li></i>
        {% endfor %}
    </ul>
{% endblock %}
