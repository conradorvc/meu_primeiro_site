{% extends "base.html" %}

{% block content %}
    <h1>Meus Projetos:</h1>
    <ul>
        {% for item in projetos %}
            <i><li class = "cartao">
                <strong><h2>{{ item.projeto }}</h2></strong>
                <p>{{ item.descricao }}</p>
                <p><strong>Data de Criação:</strong> {{ item.data_criacao }}</p>
            </li></i>
        {% endfor %}
    </ul>

{% endblock %}
