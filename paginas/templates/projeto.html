{% extends "base.html" %}

{% block content %}
    <h1>Meus Projetos:</h1>
    <a href="{% url 'novo_projeto' %}">+ Novo projeto</a>


    <ul>
        {% for item in projetos %}
            <li class="cartao">
                <h2><strong>{{ item.nome }}</strong></h2>
                <p>{{ item.descricao }}</p>
                <p><strong>Categoria:</strong> {{ item.categoria }}</p>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
